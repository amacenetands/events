# HTML sites to crawl with Claude Haiku extraction
# APIs (Eventbrite, Skiddle, Songkick) handled separately in code
#
# pipeline: can be a string or list, e.g. [family, museums]
# To add a new venue:
#   - name: "Venue Name"
#     url: "https://venue.com/events"
#     category_hint: "concert"   # concert | exhibition | kids | gallery | theatre | other
#     js_required: false         # true if events disappear with JS disabled in browser
#     skip: false
#     pipeline: family           # or [family, museums] etc.
#     notes: "Optional context for Claude extraction"

html_sites:
  # --- Aggregators ---
  - name: "Eventbrite London"
    map: "https://maps.google.com/?q=Eventbrite+London+London"
    type: "aggregator"
    must_determine_venue: true
    remove_selectors:
      - "#unsupported-browser-alert"
      - ".GlobalNav-module__main___jfEt2"
      - ".eds-structure__right-drawer"
      - ".eds-notification-bar.eds-notification-bar--warning"
    url: "https://www.eventbrite.co.uk/d/united-kingdom--london/events/"
    category_hint: "other"
    js_required: true
    skip: false
    notes: "Main aggregator — broad coverage of London events all categories"

