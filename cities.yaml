london:
  label: "London Events"
  display_name: London
  tz: Europe/London
  lang: en
  sites: sites/london.yaml   # a venue belongs to the city whose file lists it
  pricey: 100                # rank: a price above this is expensive
  crawl_tags: []             # crawl = every London venue
  api_sources: [skiddle, songkick]
  songkick_metro: 24426
  geo: [51.5074, -0.1278]    # Skiddle search centre
moscow:
  label: "Moscow Events"
  display_name: Москва
  tz: Europe/Moscow
  lang: ru
  currency: "₽"
  pricey: 10000
  sites: sites/moscow.yaml
  require_tags: [moscow, moscow-theatre]   # these tags route to Moscow (city_for_tag)
  parked_tags: [moscow-theatre]   # theatres parked: only via explicit --tag moscow-theatre
  crawl_tags: [moscow]
  api_sources: []
  geo: [55.7558, 37.6173]
# New city (/new-city <name>, .claude/skills/new-city/SKILL.md) — copy and fill:
# <name>:
#   label: "<Name> Events"          # digest title
#   display_name: <Name>             # local spelling, used in headings and map links
#   tz: Europe/<Zone>                # IANA
#   lang: en                         # must have a month/weekday table in src/normalize/dates.py (Lang):
#                                    #   en, ru today; another language needs that table first
#   currency: "€"                    # for prices given without a symbol
#   pricey: 100                      # rank: above this (in currency) is expensive
#   sites: sites/<name>.yaml         # a venue belongs to the city whose file lists it; no city tag needed
#   # optional: require_tags (tags that route --tag to this city), parked_tags (only with an explicit --tag)
#   api_sources: []                  # skiddle needs geo (UK-centric); songkick needs songkick_metro
#   geo: [<lat>, <lon>]              # centre: seed_venues.py and radius APIs
