  tags:
  - family
  type: aggregator
  category_hint: kids
  must_determine_venue: true
  hint: Only extract entries with an explicit calendar date or date range; skip evergreen attractions and places with no dates.
  skip: true
  about: 'Tested 2026-11-17: weekend-roundup page, /events/ and /things-to-do/events-festivals/ are evergreen WordPress place/attraction guides with no dates (reducer: thin page, 0 events); no event feed (feed/ empty). Nothing to extract.'
- name: Time Out London Kids Christmas
  url: https://www.timeout.com/london/kids/activities/best-london-christmas-activities-for-children
  tags:
  - family
  type: aggregator
  category_hint: kids
  must_determine_venue: true
  hint: Each numbered entry is one event. Title = the event or show name, not the editorial headline. Venue = the named venue/site (not just the neighbourhood). Every dated entry yields exactly ONE row. Entries like 'From 19 Nov to 3 Jan' or 'Nov 21-Jan 3' are a single run with date = start..end ISO range, never two rows (never a separate row for the end date). Skip entries with no dates.
  about: Time Out editorial list (Article JSON-LD only, no event data). No dedicated kids events listing exists on timeout.com/london/kids.
  skip: true
- name: Londonist Kids
  url: https://londonist.com/london/kids
